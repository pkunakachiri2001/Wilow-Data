services:
  - type: web
    name: vibration-monitor
    env: python
    buildCommand: pip install -r requirements_cloud.txt
    startCommand: gunicorn -k gevent -w 1 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - cloud_server:app
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # You'll paste this in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a random secret
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: PYTHONUNBUFFERED
        value: "1"
